name: Build mod jar
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        run: |
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" .
          git checkout "${{ github.sha }}"
      - name: Build
        run: |
          set +e
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          chmod +x gradlew
          ./gradlew build --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "error:|FAILED|What went wrong|Caused by|Could not|Exception" -A3 build.log | head -60 > errors.txt
            msg=$(tail -c 3500 errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle falhou::$msg"
          fi
          exit $code
      - name: Criar Release com o .jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la build/libs
          gh release create "v1.0.0-build${{ github.run_number }}" build/libs/viladeferro-1.0.0.jar \
            --repo "${{ github.repository }}" \
            --title "Vila de Ferro 1.0.0 (build ${{ github.run_number }})" \
            --notes "Minecraft 1.20.1 - Forge 47.x"
