name: Build mod jar
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
          cache-disabled: true
      - name: Build
        id: build
        run: |
          set +e
          gradle build --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "error:|FAILED|What went wrong|Caused by|Could not|Exception" -A3 build.log | head -60 > errors.txt
            msg=$(tail -c 3500 errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle falhou::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viladeferro-jar
          path: |
            build/libs/*.jar
            build.log
